# Prometheus configuration for Enterprise RAG System

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ═══════════════════════════════════════════════════════════════
  # RAG API 应用指标
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'enterprise-rag-api'
    static_configs:
      - targets: ['rag-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ═══════════════════════════════════════════════════════════════
  # Prometheus 自身监控
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
