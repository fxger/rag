# Prometheus configuration for Enterprise RAG System

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则。注意：路径必须与 docker-compose.yml 中挂载到容器内的位置一致，
# 文件缺失时 Prometheus 会直接启动失败（不是静默忽略）。
rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # ═══════════════════════════════════════════════════════════════
  # RAG API 应用指标
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'enterprise-rag-api'
    static_configs:
      - targets: ['rag-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ═══════════════════════════════════════════════════════════════
  # Prometheus 自身监控
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
