# Enterprise RAG System — Docker Compose (Production)
# App only — external services run on VMs.

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=false
      - LOG_LEVEL=WARNING
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - rag-network

  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rag-api
    restart: always
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge